name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Install Chinese language file
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" -OutFile "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"

      - name: Download VC++ Redistributable
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "packaging\windows\vc_redist.x64.exe"

      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:APP_VERSION -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$version packaging\windows\notepad.iss

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/windows/installer/*.exe
          generate_release_notes: true

  build-linux:
    name: Build Linux packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package tar.gz
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          VERSION=${APP_VERSION#v}
          tar -czf "Notepad-${VERSION}-linux-x64.tar.gz" -C build/linux/x64/release/bundle .

      - name: Package deb
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          VERSION=${APP_VERSION#v}
          mkdir -p deb/DEBIAN deb/opt/notepad deb/usr/share/applications
          cp -r build/linux/x64/release/bundle/. deb/opt/notepad/
          cp -r packaging/linux/icons/hicolor deb/usr/share/icons/
          cat > deb/DEBIAN/control <<EOF
          Package: notepad
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: szxufan <szxufan@126.com>
          Depends: libgtk-3-0
          Description: 基于 Flutter 的桌面端纯文本记事本应用
           支持多文件编辑、查找替换、全局搜索、草稿自动保存与恢复。
          EOF
          cat > deb/usr/share/applications/notepad.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Notepad
          Comment=桌面端纯文本记事本
          Exec=/opt/notepad/notepad
          Icon=notepad
          Categories=Utility;TextEditor;
          EOF
          dpkg-deb --build --root-owner-group deb "Notepad-${VERSION}-linux-x64.deb"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Notepad-*-linux-x64.tar.gz
            Notepad-*-linux-x64.deb

  build-macos:
    name: Build macOS dmg
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package dmg
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          VERSION=${APP_VERSION#v}
          APP_PATH=$(ls -d build/macos/Build/Products/Release/*.app | head -n 1)
          hdiutil create -volname "Notepad" -srcfolder "$APP_PATH" -ov -format UDZO "Notepad-${VERSION}-macos.dmg"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: Notepad-*-macos.dmg
